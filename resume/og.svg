<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(57,211,83,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0d1117"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- terminal window -->
  <rect x="120" y="120" width="960" height="390" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <!-- title bar -->
  <rect x="120" y="120" width="960" height="52" rx="14" fill="#1c2128"/>
  <rect x="120" y="150" width="960" height="22" fill="#1c2128"/>
  <circle cx="156" cy="146" r="7" fill="#f85149"/>
  <circle cx="182" cy="146" r="7" fill="#e3b341"/>
  <circle cx="208" cy="146" r="7" fill="#39d353"/>
  <text x="240" y="151" font-family="'JetBrains Mono', monospace" font-size="16" fill="#8b949e">vitor@portfolio: ~</text>

  <!-- content -->
  <text x="160" y="232" font-family="'JetBrains Mono', monospace" font-size="22" fill="#8b949e"><tspan fill="#39d353">$</tspan> whoami</text>
  <text x="160" y="300" font-family="'JetBrains Mono', monospace" font-size="56" font-weight="700" fill="#c9d1d9">Vitor Figueredo</text>
  <text x="160" y="352" font-family="'JetBrains Mono', monospace" font-size="28" fill="#56d4dd"><tspan fill="#8b949e">// </tspan>Tech Lead · Full Stack · Software Architect</text>
  <text x="160" y="420" font-family="'JetBrains Mono', monospace" font-size="20" fill="#8b949e">PHP · Laravel · React · .NET · 10+ years building critical systems</text>

  <rect x="160" y="452" width="230" height="40" rx="6" fill="rgba(57,211,83,0.1)" stroke="#39d353" stroke-width="1.5"/>
  <text x="275" y="478" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" fill="#39d353" text-anchor="middle">vitorfigueredo.dev</text>
</svg>
